# web-user 用户侧站点（T7）：自助工作流（/workflows、/kb、/executions、/quota）
# 与管理后台 aipanel.conf（/panel，8080）完全分离，独立端口 8081
# 前端 baseURL=/api（web-user/src/utils/request.js），后端 app_wrapper 去 /api 前缀处理
# upstream aipanel_app 定义于 aipanel.conf（conf.d 全局共享），此处直接复用

server {
    listen 8081;
    server_name _;

    # 前端静态根（compose 将宿主机 web-user/dist 挂载到此；SPA 需 history 回退）
    root /usr/share/nginx/html/user;
    index index.html;

    # API 反代到后端（SSE：工作流 dry-run 走 /api/v1/agent/u/... 流式，必须关缓冲 + 长超时）
    location /api/ {
        proxy_pass http://aipanel_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：清空 Connection 启用 keepalive
        proxy_set_header Connection "";

        # SSE 关键：关缓冲防攒批；长超时覆盖 HITL 长暂停（心跳帧 15s 保活）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding on;
    }

    # 前端静态资源 + SPA history 回退（web-user base='/'，vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
