# aipaneladmin 站点配置
# H-3 硬约束：SSE 长连接必须 ①关闭代理缓冲 ②空闲超时 ≥30s（SSE 心跳帧 15s，留一倍余量）
# 验收实测：SSE 心跳帧 16s 可达（_t15_bug014_v2_hitl.py V2-D）；断开自愈 P95 0.08s

upstream aipanel_app {
    server app:9998;
    # 单 worker 后端：keepalive 连接复用即可，无需负载均衡策略
    keepalive 32;
}

upstream dsh_app {
    server dsh:3080;
    keepalive 16;
}

# WebSocket 升级头：dsh 浏览器的实时通道是 /api/remote.mux（WebSocket）。
# 命中 upgrade 时转发 Upgrade/Connection: upgrade；普通请求保持空 Connection（不打断 SSE/keepalive）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://aipanel_app;
        proxy_http_version 1.1;

        # 通用头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：清空 Connection 头启用 keepalive，且不做 upgrade 干扰
        proxy_set_header Connection "";

        # H-3 核心：SSE 流式响应必须关缓冲，否则事件帧被攒批、心跳帧延迟导致误判断开
        proxy_buffering off;
        proxy_cache off;

        # H-3 核心：读超时覆盖 HITL 长暂停（心跳帧 15s 保活；1h 覆盖常规暂停，
        # 72h 极限场景由心跳帧持续刷新超时窗口，无需无限放大）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # 分块传输直通（SSE 走 chunked）
        chunked_transfer_encoding on;
    }

    # Prometheus 指标端点（如需对外暴露可单独加访问控制；默认随站点转发）
    location = /metrics {
        proxy_pass http://aipanel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 内网抓取场景建议加 allow/deny 收敛：
        # allow 10.0.0.0/8; deny all;
    }
}

# ── DeepSeek Harness Web UI ──
# DeepSeek Harness 是完整 SPA，默认假设根路径部署，这里用独立端口避免子路径重写问题
# 访问地址: http://localhost:8082/
server {
    listen 8082;
    server_name _;

    location / {
        proxy_pass http://dsh_app;
        proxy_http_version 1.1;

        # dsh 的 /api 有 Host/Origin 同源围栏：浏览器 Origin 带端口（http://127.0.0.1:8082），
        # 若这里用 $host（去掉端口）回填，Host 变 127.0.0.1 与 Origin 不一致，接口一律 403。
        # 认证 Cookie 也按 authority 绑定，必须原样保留 host:port。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 实时通道是 WebSocket（/api/remote.mux）：必须透传 Upgrade，
        # 否则握手被当普通请求返回 400，前端表现为一直「重新连接中」。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # dsh Web UI 内部也有 SSE/流式输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        chunked_transfer_encoding on;
    }
}
