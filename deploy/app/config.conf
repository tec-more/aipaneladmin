# 本机 docker 验证用配置（验证后删除，勿提交）
[app]
name = AIPanelAdmin
version = v0.1.0
description = AIPanelAdmin API Documentation
debug = false
frontend_name = 黑糖分销
backend_name = 黑糖分销

[deploy]
env = docker
strict_startup = true

[db]
db_host = host.docker.internal
db_name = aipaneladmin
db_user = admin
db_password = Admin@123
db_port = 15432
minsize = 5
maxsize = 20
timeout = 30
command_timeout = 30

[storage]
path = /app/storage

[log]
path = /app/logs

[redis]
enabled = true
host = redis
port = 6379
password = Test@Redis123
db = 0

[qdrant]
enabled = true
host = http://host.docker.internal:6333
api_key = 8sK7xR2pG9tL5bN3qA6dF4zJ
timeout = 300

[email]
enabled = false
smtp_host =
smtp_port = 465
smtp_use_tls = false
sender_email =
sender_password =
sender_name =

[audit]
enabled = true
retention_days = 90
log_http_requests = true
log_data_changes = true
log_login = true
trace_enabled = false

[monitoring]
prometheus_enabled = true
prometheus_port = 9090
push_enabled = false
pushgateway = localhost:9091
push_interval = 10

[elk]
enabled = false

[jaeger]
enabled = false
host = localhost
port = 6831

[rabbitmq]
enabled = false
host = host.docker.internal
port = 5672
virtual_host = /
username = admin
password = Admin@123
exchange = event_bus.exchange
queue_prefix = event_bus
dlq_name = event_bus.dlq
prefetch_count = 10
max_retries = 3
publish_confirm_timeout = 5
connection_retry_interval = 5
degraded_cooldown = 30
