# aipaneladmin 生产配置模板（docker-compose 部署形态）
# 用法：cp config.docker.conf config.conf，按实际环境填写后挂载到容器
# ⚠️ 填写后的 config.conf 含敏感信息，严禁提交仓库（已建议加入 .gitignore）
#
# 与开发版 config.conf 的关键差异：
#   - [deploy] 段：env=docker + strict_startup=true（启动自检硬约束生效）
#   - [redis] enabled=true / host=redis（H-2：随编排启动的 Redis 服务名）
#   - [db]/[qdrant]/[rabbitmq] host 指向宿主机或编排内服务名

[app]
name = AIPanelAdmin
version = v0.1.0
description = AIPanelAdmin API Documentation
debug = false
frontend_name = 黑糖分销
backend_name = 黑糖分销

[deploy]
# 部署环境：dev / prod / docker（docker 视同生产，启用严格自检）
env = docker
# 严格启动：true 时 H-1/H-2 硬约束违规拒绝启动；仅临时调试可置 false
strict_startup = true

[db]
# docker 容器访问宿主机 DB 用 host.docker.internal；DB 也容器化时改为服务名
db_host = host.docker.internal
db_name = aipaneladmin
db_user = admin
db_password = __CHANGE_ME__
db_port = 15432
minsize = 5
maxsize = 20
timeout = 30
command_timeout = 30

[storage]
path = /app/storage

[log]
path = /app/logs

[redis]
# H-2 硬约束：生产必须 true（分布式并发槽 + TTL 兜底）
enabled = true
host = redis
port = 6379
password = __CHANGE_ME__
db = 0

[qdrant]
enabled = true
host = http://host.docker.internal:6333
api_key = __CHANGE_ME__
timeout = 300

[email]
enabled = false
smtp_host =
smtp_port = 465
smtp_use_tls = false
sender_email =
sender_password =
sender_name =

[audit]
enabled = true
retention_days = 90
log_http_requests = true
log_data_changes = true
log_login = true
trace_enabled = false

[monitoring]
# Prometheus /metrics 端点（deploy/prometheus/prometheus.yml 抓取）
prometheus_enabled = true
prometheus_port = 9090
push_enabled = false
pushgateway = localhost:9091
push_interval = 10

[elk]
enabled = false

[jaeger]
enabled = false
host = localhost
port = 6831

[rabbitmq]
enabled = false
host = host.docker.internal
port = 5672
virtual_host = /
username = admin
password = __CHANGE_ME__
exchange = event_bus.exchange
queue_prefix = event_bus
dlq_name = event_bus.dlq
prefetch_count = 10
max_retries = 3
publish_confirm_timeout = 5
connection_retry_interval = 5
degraded_cooldown = 30
