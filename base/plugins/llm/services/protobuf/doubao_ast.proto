syntax = "proto3";

package doubao.ast;

// ========== 请求消息 ==========

// 建联请求
message StartSessionRequest {
  RequestMeta request_meta = 1;
  int32 event = 2;  // 100
  User user = 3;
  RequestConfig request = 4;
  SourceAudio source_audio = 5;
  TargetAudio target_audio = 6;
}

// 发送音频数据
message TaskRequest {
  int32 event = 1;  // 200
  SourceAudio source_audio = 2;
}

// 更新配置
message UpdateConfigRequest {
  int32 event = 1;  // 201
  RequestConfig request = 2;
}

// 结束会话
message FinishSessionRequest {
  int32 event = 1;  // 102
}

// ========== 响应消息 ==========

// 建联成功响应
message SessionStartedResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 150
}

// 原文开始
message SourceSubtitleStart {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 650
  int32 start_time = 3;
  bool spk_chg = 4;
}

// 原文数据
message SourceSubtitleResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 651
  string text = 3;
}

// 原文结束
message SourceSubtitleEnd {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 652
  int32 start_time = 3;
  int32 end_time = 4;
  string text = 5;
}

// 译文开始
message TranslationSubtitleStart {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 653
  int32 start_time = 3;
  bool spk_chg = 4;
}

// 译文数据
message TranslationSubtitleResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 654
  string text = 3;
}

// 译文结束
message TranslationSubtitleEnd {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 655
  int32 start_time = 3;
  int32 end_time = 4;
  string text = 5;
}

// TTS开始
message TTSSentenceStart {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 350
  int32 start_time = 3;
}

// TTS数据
message TTSResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 352
  bytes data = 3;
}

// TTS结束
message TTSSentenceEnd {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 351
  bytes data = 3;
  int32 start_time = 4;
  int32 end_time = 5;
}

// 计量计费
message UsageResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 154
  Billing billing = 3;
}

// 会话结束
message SessionFinishedResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 152
}

// 会话失败
message SessionFailedResponse {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 153
}

// 静音事件
message AudioMuted {
  ResponseMeta response_meta = 1;
  int32 event = 2;  // 250
  int32 muted_duration_ms = 3;
}

// ========== 通用数据结构 ==========

message RequestMeta {
  string session_id = 1;
}

message ResponseMeta {
  string session_id = 2;
  int32 status_code = 3;
  string message = 4;
  Billing billing = 5;
}

message User {
  string uid = 1;
  string did = 2;
  string platform = 3;
  string sdk_version = 4;
}

message RequestConfig {
  string mode = 1;  // s2t or s2s
  string source_language = 2;  // zh or en
  string target_language = 3;  // zh or en
  Corpus corpus = 4;
  string service_name = 5;  // 服务名称，如"translate"或"ast"
}

message Corpus {
  repeated string hot_words_list = 1;
  map<string, string> glossary_list = 2;
}

message SourceAudio {
  string format = 1;  // wav
  string codec = 2;  // raw
  int32 rate = 3;  // 16000
  int32 bits = 4;  // 16
  int32 channel = 5;  // 1
  bytes data = 6;  // 音频二进制数据
}

message TargetAudio {
  string format = 1;  // pcm or ogg_opus
  int32 rate = 2;  // 16000 or 24000
}

message Billing {
  int32 duration_msec = 1;
  repeated BillingItem items = 2;
}

message BillingItem {
  string unit = 1;
  double quantity = 2;
}
