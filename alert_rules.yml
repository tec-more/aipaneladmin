groups:
  - name: aipaneladmin_alerts
    rules:
      - alert: HighRequestLatency
        expr: http_request_duration_seconds_avg > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High request latency detected"
          description: "Average request latency is {{ $value }} seconds"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}%"

      - alert: ServiceUnavailable
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is unavailable"
          description: "The service at {{ $labels.instance }} is down"

      - alert: HighActiveRequests
        expr: http_active_requests > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High active requests"
          description: "Number of active requests is {{ $value }}"