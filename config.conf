[app]
name = AIPanelAdmin
version = v0.1.0
description = AIPanelAdmin API Documentation
debug = true
[db]
db_host = 127.0.0.1
db_name = aipaneladmin
db_user = admin
db_password = 123456
db_port = 5432
[log]
path = D:\Programs\fastapi\aipaneladmin\logs
[redis]
enabled = false
host = 127.0.0.1
port = 6379
password =
db = 0

[aif2f]
# AIF2F插件配置
enabled = true

[aif2f.payment]
# 支付配置
order_expire_minutes = 15
auto_check_interval = 300

# 微信支付配置（需填写真实配置）
wechat_app_id =
wechat_mch_id =
wechat_api_key =
wechat_api_cert_path =
wechat_api_key_path =
wechat_notify_url = https://yourdomain.com/api/v1/aif2f/payment/wechat/notify

# 支付宝配置（需填写真实配置）
alipay_app_id =
alipay_private_key_path =
alipay_public_key_path =
alipay_notify_url = https://yourdomain.com/api/v1/aif2f/payment/alipay/notify

[aif2f.membership]
# 会员配置
default_free_hours = 0
max_fibonacci_level = 20