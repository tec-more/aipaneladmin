
services:
  # 1. Qwen3.6-35B 大模型 → GPU 加速 (llama.cpp + TQ3 + TurboQuant)
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-qwen
    restart: unless-stopped
    ports:
      - "8201:8201"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models:/models
    command: >
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --host 0.0.0.0
      --port 8201
      --n-gpu-layers 99
      --ctx-size 16384
      --batch-size 512
      --ubatch-size 256
      --parallel 1
      --cont-batching
      --jinja
      --chat-template-kwargs '{"enable_thinking":false}'
      --api-key sk-hp123456789
      --no-mmap
      --mlock
      --threads 12

  # 2. bge-m3 向量模型 → 纯 CPU 运行 (不占显卡)
  bge:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-bge-m3
    ports:
      - "8202:8202"
    volumes:
      - ./models:/models
    command: >
      --model /models/bge-m3-Q8_0.gguf
      --host 0.0.0.0
      --port 8202
      --embedding
      --n-gpu-layers 0
      --api-key sk-hp123456789